version: '3.8'

services:
  # 1. MongoDB Database
  mongo:
    image: mongo:7.0
    container_name: omnicheck_mongo
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - omnicheck_network

  # 2. Redis Message Broker & In-Memory Cache
  redis:
    image: redis:7-alpine
    container_name: omnicheck_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - omnicheck_network

  # 3. Python AI Research & Adversarial Benchmark Engine
  ai-engine:
    build:
      context: ./ai-engine
      dockerfile: Dockerfile
    container_name: omnicheck_ai_engine
    restart: always
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - GROQ_API_KEY_1=${GROQ_API_KEY_1:-}
      - GROQ_MODEL=${GROQ_MODEL:-llama-3.3-70b-versatile}
    networks:
      - omnicheck_network

  # 4. MERN Backend & WebSocket Hub
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: omnicheck_server
    restart: always
    depends_on:
      - mongo
      - redis
      - ai-engine
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - MONGODB_URI=mongodb://mongo:27017/omni_check
      - REDIS_URL=redis://redis:6379
      - AI_ENGINE_URL=http://ai-engine:8000
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - GROQ_API_KEY_1=${GROQ_API_KEY_1:-}
      - GROQ_API_KEY_2=${GROQ_API_KEY_2:-}
      - GROQ_MODEL=${GROQ_MODEL:-llama-3.3-70b-versatile}
      - CLIENT_URL=http://localhost
    networks:
      - omnicheck_network

  # 5. React 18 Production Frontend
  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: omnicheck_client
    restart: always
    depends_on:
      - server
    ports:
      - "80:80"
    networks:
      - omnicheck_network

volumes:
  mongo_data:
  redis_data:

networks:
  omnicheck_network:
    driver: bridge
